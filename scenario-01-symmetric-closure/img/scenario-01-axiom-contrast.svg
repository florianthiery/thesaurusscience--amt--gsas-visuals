<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 420" width="1220" height="420">
<defs></defs>
<rect x="0" y="0" width="1220" height="420" fill="#ffffff"/>
<text x="610.0" y="34.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Why this scenario has no fuzzy-operator choice to make</text><rect x="60.0" y="70.0" width="520.0" height="260.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="320.0" y="96.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000">amt:InverseAxiom (this scenario)</text><text x="320.0" y="140.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#000000">One antecedent, one inverse</text><text x="320.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">edge mirrored, weight copied as-is</text><text x="320.0" y="180.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">amt:weight(inferred) = amt:weight(asserted)</text><text x="320.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="320.0" y="220.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">No amt:logic property at all -</text><text x="320.0" y="240.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">_apply_inverse() doesn't read one;</text><text x="320.0" y="260.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">the mirroring is a copy, not a composition</text><rect x="640.0" y="70.0" width="520.0" height="260.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="900.0" y="96.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000">amt:RoleChainAxiom (scenarios 3 &amp; 5)</text><text x="900.0" y="150.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#000000">Two or more antecedents</text><text x="900.0" y="170.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">weights combined along the chain</text><text x="900.0" y="190.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">amt:weight(inferred) = op(w1, w2, ...)</text><text x="900.0" y="210.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="900.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">amt:logic is required -</text><text x="900.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">choice of operator changes the result</text><text x="610.0" y="360.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">This is why scenario 1's weights are exact copies (w=1.00, w=0.60) while scenarios 3 and 5 show six different answers for the same chain - the two axiom types solve different problems.</text>
</svg>
