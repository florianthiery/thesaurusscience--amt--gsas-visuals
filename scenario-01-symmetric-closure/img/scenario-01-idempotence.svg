ray="6,4"/><text x="875.0" y="198.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">exactMatch</text><text x="875.0" y="216.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#ffffff">inferred, w=1.00 (unchanged)</text><line x1="580.0" y1="55.0" x2="580.0" y2="260.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,5"/><text x="580.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">AMT only strengthens edges already marked amt:inferred; it never</text><text x="580.0" y="318.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">overwrites an asserted one (amt/reasoning.py). Since run 1's inferred</text><text x="580.0" y="336.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">edge already carries the maximum weight the axiom would produce,</text><text x="580.0" y="354.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">run 2 changes nothing - the fixed point is reached in one pass here.</text>
