<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460">
<defs></defs>
<rect x="0" y="0" width="1280" height="460" fill="#ffffff"/>
<text x="640.0" y="34.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Which GSAS model fits which situation?</text><rect x="40.0" y="80.0" width="280.0" height="300.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="180.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000">Minimal</text><text x="180.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Only plain SKOS mappings</text><text x="180.0" y="220.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">exist, no confidence data.</text><text x="180.0" y="240.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000"></text><text x="180.0" y="260.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Quick ranking or</text><text x="180.0" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">threshold-based filtering.</text><rect x="360.0" y="80.0" width="280.0" height="300.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="500.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000">4-Level</text><text x="500.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Human annotation, curation</text><text x="500.0" y="220.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">or documentation work.</text><text x="500.0" y="240.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000"></text><text x="500.0" y="260.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Communicable categories</text><text x="500.0" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">matter more than precision.</text><rect x="680.0" y="80.0" width="280.0" height="300.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="820.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000">7-Star</text><text x="820.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Technical pipelines and</text><text x="820.0" y="220.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">research infrastructure.</text><text x="820.0" y="240.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000"></text><text x="820.0" y="260.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Fine-grained, reproducible,</text><text x="820.0" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">formally reasoned degrees.</text><rect x="1000.0" y="80.0" width="280.0" height="300.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="1140.0" y="114.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000">Perceptions</text><text x="1140.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Confidence is expressed in</text><text x="1140.0" y="220.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">natural-language phrases,</text><text x="1140.0" y="240.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">not explicit mapping types.</text><text x="1140.0" y="260.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000"></text><text x="1140.0" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#000000">Empirically grounded degrees.</text><text x="640.0" y="420.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Paraphrased from the GSAS paper's own stated rationale for each model (Sections 2.3-2.6) - the four are complementary</text><text x="640.0" y="438.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">entry points into the same Degree-of-Connection scale, not a hierarchy from worst to best.</text>
</svg>
