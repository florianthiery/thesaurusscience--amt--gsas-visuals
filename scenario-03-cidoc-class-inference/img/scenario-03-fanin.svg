s</text><text x="800.0" y="182.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#000000">w = 0.900*</text><polyline points="290.0,110.0 290.0,445.0 1000.0,445.0 1000.0,272.0" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrowhead_1)"/><polyline points="290.0,230.0 290.0,445.0 1000.0,445.0 1000.0,272.0" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrowhead_1)"/><polyline points="290.0,350.0 290.0,445.0 1000.0,445.0 1000.0,272.0" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrowhead_1)"/><text x="660.0" y="500.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">All three inherit the same class via amt:RoleChainAxiom, each with w = 0.839 (Einstein product) - one axiom, applied once, covers every concept that ever closeMatches this anchor.</text><text x="660.0" y="522.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">* product of the two real GSAS weights only, before the third (illustrative) step - see the scenario README.</text>
