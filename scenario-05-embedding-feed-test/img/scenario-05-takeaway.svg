<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 400" width="1320" height="400">
<defs></defs>
<rect x="0" y="0" width="1320" height="400" fill="#ffffff"/>
<text x="660.0" y="40.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a">Lasse's test, answered</text><rect x="140.0" y="100.0" width="1040.0" height="260.0" rx="10" ry="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="660.0" y="122.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">"What happens if you feed AMT with the embedding distances?"</text><text x="660.0" y="146.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8" fill="#0f172a"></text><text x="660.0" y="170.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">Same 3-link chain, only the first edge's weight changes: 0.938 (GSAS) vs 0.65 (raw, illustrative).</text><text x="660.0" y="194.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#0f172a"></text><text x="660.0" y="218.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">Spread across all 6 operators: 0.107 (GSAS-calibrated) vs 0.286 (raw embedding) - roughly 2.7x wider.</text><text x="660.0" y="242.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#0f172a"></text><text x="660.0" y="266.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">GSAS's calibration doesn't just add interpretability - by pushing</text><text x="660.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">values toward the extremes, it also makes the choice of AMT</text><text x="660.0" y="314.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">operator matter less. Feeding raw similarities works, but the</text><text x="660.0" y="338.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">result depends more on which operator you pick.</text>
</svg>
