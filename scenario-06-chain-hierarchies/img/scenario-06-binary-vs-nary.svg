<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
<defs></defs>
<rect x="0" y="0" width="1280" height="420" fill="#ffffff"/>
<text x="640.0" y="34.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Two different strategies for combining n weights</text><rect x="40.0" y="70.0" width="540.0" height="300.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="310.0" y="96.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000">Binary operators (folded pairwise)</text><text x="310.0" y="154.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#000000">Goedel, Product, Lukasiewicz,</text><text x="310.0" y="173.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#000000">Einstein, Hamacher</text><text x="310.0" y="192.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="310.0" y="211.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">score = w_1</text><text x="310.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">for i in 2..n:</text><text x="310.0" y="249.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">    score = op(score, w_i)</text><text x="310.0" y="268.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="310.0" y="287.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">Associative - order of folding</text><text x="310.0" y="306.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">does not change the result.</text><rect x="640.0" y="70.0" width="540.0" height="300.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="910.0" y="96.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000">N-ary operators (whole list at once)</text><text x="910.0" y="154.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#000000">GeometricMean</text><text x="910.0" y="173.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#000000"></text><text x="910.0" y="192.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="910.0" y="211.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">score = (w_1 * w_2 * ... * w_n)</text><text x="910.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">        ^ (1/n)</text><text x="910.0" y="249.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000"></text><text x="910.0" y="268.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="910.0" y="287.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">Needs the full weight list at once -</text><text x="910.0" y="306.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">cannot be computed incrementally.</text><text x="640.0" y="392.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">The amt:arity annotation on each amt:Logic instance tells a reasoner which strategy to use - copied from amt-engine's ontology README, not re-derived.</text>
</svg>
