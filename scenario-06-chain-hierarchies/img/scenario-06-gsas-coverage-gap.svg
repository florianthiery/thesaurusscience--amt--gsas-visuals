<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340">
<defs></defs>
<rect x="0" y="0" width="1280" height="340" fill="#ffffff"/>
<text x="640.0" y="34.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">GSAS calibrates three of the five SKOS mapping properties</text><rect x="180.0" y="100.0" width="170.0" height="90.0" rx="10" ry="10" fill="#166534" stroke="#000000" stroke-width="1.5"/><text x="265.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">exactMatch</text><text x="265.0" y="157.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">GSAS: 1.0</text><rect x="380.0" y="100.0" width="170.0" height="90.0" rx="10" ry="10" fill="#166534" stroke="#000000" stroke-width="1.5"/><text x="465.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">closeMatch</text><text x="465.0" y="157.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">GSAS: 0.938</text><rect x="580.0" y="100.0" width="170.0" height="90.0" rx="10" ry="10" fill="#166534" stroke="#000000" stroke-width="1.5"/><text x="665.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">relatedMatch</text><text x="665.0" y="157.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">GSAS: 0.495 (mean)</text><text x="480.0" y="220.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#166534">Calibrated by all four GSAS models</text><rect x="900.0" y="100.0" width="170.0" height="90.0" rx="10" ry="10" fill="#4c1d95" stroke="#000000" stroke-width="1.5"/><text x="985.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">broadMatch</text><text x="985.0" y="157.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">no GSAS degree exists</text><rect x="1100.0" y="100.0" width="170.0" height="90.0" rx="10" ry="10" fill="#4c1d95" stroke="#000000" stroke-width="1.5"/><text x="1185.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">narrowMatch</text><text x="1185.0" y="157.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff">no GSAS degree exists</text><text x="1000.0" y="220.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">Not covered by any GSAS model</text><text x="640.0" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">This scenario's narrowMatch edges therefore use the relatedMatch degree (0.4947) as a reasoned analogy, not a GSAS value for narrowMatch itself - stated in</text><text x="640.0" y="300.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">data/real_chains.tsv's own header. A principled GSAS extension to hierarchical mapping properties is future work, not something this repository claims exists.</text>
</svg>
