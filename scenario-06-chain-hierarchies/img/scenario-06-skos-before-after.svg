<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460">
<defs></defs>
<rect x="0" y="0" width="1280" height="460" fill="#ffffff"/>
<text x="640.0" y="34.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">What plain SKOS can and cannot infer</text><rect x="40.0" y="70.0" width="540.0" height="340.0" rx="10" ry="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="310.0" y="96.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Plain SKOS</text><text x="310.0" y="135.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Only skos:exactMatch is transitive</text><text x="310.0" y="154.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">(SKOS Reference, Section 10.1).</text><text x="310.0" y="173.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#0f172a"></text><text x="310.0" y="192.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">closeMatch/broadMatch/narrowMatch/</text><text x="310.0" y="211.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">relatedMatch are deliberately NOT -</text><text x="310.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">to avoid compound errors across</text><text x="310.0" y="249.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">more than two concept schemes.</text><text x="310.0" y="268.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#0f172a"></text><text x="310.0" y="287.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">Result: a narrowMatch into vocabulary B</text><text x="310.0" y="306.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">cannot reach vocabulary C, even via a</text><text x="310.0" y="325.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">closeMatch already asserted in B.</text><rect x="640.0" y="70.0" width="540.0" height="340.0" rx="10" ry="10" fill="#fbbf24" stroke="#000000" stroke-width="1.5"/><text x="910.0" y="96.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000">SKOS + AMT (this scenario)</text><text x="910.0" y="135.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#000000">Any mix of mapping properties can</text><text x="910.0" y="154.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">be composed via amt:RoleChainAxiom.</text><text x="910.0" y="173.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="910.0" y="192.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">The result is not asserted as fact -</text><text x="910.0" y="211.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">it carries a degraded amt:weight,</text><text x="910.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">computed by the chosen operator.</text><text x="910.0" y="249.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="6" fill="#000000"></text><text x="910.0" y="268.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">This is the principled version of what</text><text x="910.0" y="287.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">SKOS's design avoided: composition</text><text x="910.0" y="306.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">with the uncertainty made explicit,</text><text x="910.0" y="325.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#000000">not composition assumed for free.</text><text x="640.0" y="430.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Paraphrased from the SKOS Reference, Section 10.1 (not a verbatim quote) and from amt-engine's own ontology README.</text>
</svg>
