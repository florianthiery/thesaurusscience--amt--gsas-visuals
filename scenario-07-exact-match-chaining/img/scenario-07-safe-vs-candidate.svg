<rect x="80.0" y="120.0" width="720.0" height="760.0" rx="10" ry="10" fill="#166534" stroke="#000000" stroke-width="1.5"/><text x="440.0" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Story A - curated</text><text x="440.0" y="310.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff"></text><text x="440.0" y="340.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">Both edges are real, asserted</text><text x="440.0" y="370.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">skos:exactMatch rows.</text><text x="440.0" y="400.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff"></text><text x="440.0" y="430.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">GSAS degree = 1.0 for both,</text><text x="440.0" y="460.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">unconditionally - no calibration</text><text x="440.0" y="490.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">step involved.</text><text x="440.0" y="520.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff"></text><text x="440.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">amt:RoleChainAxiom composes</text><text x="440.0" y="580.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">them with near-full confidence.</text><text x="440.0" y="610.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff"></text><text x="440.0" y="640.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Edge style: solid</text><rect x="890.0" y="120.0" width="720.0" height="760.0" rx="10" ry="10" fill="#4c1d95" stroke="#000000" stroke-width="1.5"/><text x="1250.0" y="295.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Story B - candidate</text><text x="1250.0" y="325.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff"></text><text x="1250.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">The edge is a raw similarity</text><text x="1250.0" y="385.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">score from an embedding or</text><text x="1250.0" y="415.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">string technique - not yet a</text><text x="1250.0" y="445.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">curated mapping.</text><text x="1250.0" y="475.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff"></text><text x="1250.0" y="505.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">Needs a calibration step before</text><text x="1250.0" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">amt:weight means anything -</text><text x="1250.0" y="565.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">see scenario-07-calibration-pipeline.</text><text x="1250.0" y="595.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff"></text><text x="1250.0" y="625.0" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Edge style: dashed</text>
